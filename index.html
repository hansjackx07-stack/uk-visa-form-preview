 rows[idx][f.name]=v;commit(q,rows,(f.type==='单选'||f.type==='下拉')&&changed);return}
 if(q.type==='单选'||q.type==='多选'){if(!changed)return;let v=q.type==='多选'?Array.from(e.currentTarget.querySelectorAll('input[data-main]:checked')).map(x=>x.value):e.currentTarget.querySelector('input[data-main]:checked')?.value||'';commit(q,v,true);return}
 if(t.dataset.part){let v={...(val(q)||{})};v[t.dataset.part]=q.type==='姓名组'?t.value.toUpperCase():t.value;if(q.type==='姓名组')t.value=v[t.dataset.part];commit(q,v);return}

function isTravel(q){return [39,41,43].includes(q.n)}
function dateBounds(v,isTravelDate){let txt=typeof v==='object'?v?.value:v;if(!txt)return [];let month=typeof v==='object'&&v?.precision==='month'||/^\d{4}-\d{2}$/.test(String(txt));let low=month?txt+'-01':txt, high=month?txt+'-31':txt;let e=[];if(low>dayNow())e.push('日期不得晚于今天。');if(isTravelDate&&high<tenYearsAgo())e.push('出行日期不得早于今天往前10年。');return e}
function validate(q){let v=val(q),errors=[];if(['提示','说明文字'].includes(q.type))return errors;
 if(q.required&&isEmpty(v))errors.push('此题为必填项。');
 if(q.type==='姓名组'&&q.required&&(!String(v?.family||'').trim()||!String(v?.given||'').trim()))errors.push('请填写完整的姓和名。');
 if(['地址组','省市区联动'].includes(q.type)&&q.required){let keys=q.type==='地址组'?['省','市','区','详细地址','邮编']:['省','市','区'];if(keys.some(k=>!String(v?.[k]||'').trim()))errors.push('请填写完整地址。');if(v?.邮编&&!/^\d{6}$/.test(v.邮编))errors.push('邮编应为6位数字。')}
 if(q.type==='手机号'&&v&&!/^\d{11}$/.test(v))errors.push('手机号应为11位数字。');if(q.type==='邮箱'&&v&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v))errors.push('邮箱格式不正确。');if(q.n===13&&v&&!/^\d{6}$/.test(v))errors.push('邮编应为6位数字。');
 if(q.type==='数字'&&v!==undefined&&v!==''&&(!Number.isFinite(Number(v))||Number(v)<0))errors.push('请输入非负数字。');
 if(q.n===3&&v==='不同意')errors.push('不同意个人信息处理授权，无法继续。');
 if(q.n===33&&v==='是'){let d=parentTravelDetails(),parents=Array.isArray(d.parents)?d.parents:[];if(!parents.length)errors.push('请至少选择一位随团同行的家长。');for(let p of parents){if(!String(d[p==='父亲'?'father_passport':'mother_passport']||'').trim())errors.push('请填写学生的'+p+'护照号码。')}}

 if((q.type==='单选'||q.type==='多选')&&(Array.isArray(v)?v.some(other):other(v||''))&&!otherData(q).trim())errors.push('请填写“其他”的具体内容。');
 if(q.type==='年月'&&v&&(!Number.isFinite(monthNum(v))||monthNum(v)>currentMonth()))errors.push('年月不正确或晚于当前年月。');
 if(q.type==='日期'&&v)errors.push(...dateBounds(v,false));
 if(q.type==='重复组'){let rows=Array.isArray(v)&&v.length?v:[{}],fields=subfields(q);for(let i=0;i<rows.length;i++){let row=rows[i];for(let f of fields){let item=row[f.name],entry=typeof item==='object'&&item?.value!==undefined?item.value:item;
 if(q.required&&!f.optional&&isEmpty(entry))errors.push(`第${i+1}组：${f.name}不能为空。`);
 if(f.type==='省市区联动'&&q.required&&!['省','市','区'].every(k=>String(item?.[k]||'').trim()))errors.push(`第${i+1}组：请填写完整省市区。`);
 if(f.type==='日期·可只填年月'||f.type==='日期'){for(let e of dateBounds(item,isTravel(q)))errors.push(`第${i+1}组：${e}`)}
 if(f.type==='年月'&&entry){if(!Number.isFinite(monthNum(entry))||monthNum(entry)>currentMonth())errors.push(`第${i+1}组：${f.name}年月不正确或晚于本月。`);if(isTravel(q)&&entry+'-31'<tenYearsAgo())errors.push(`第${i+1}组：出行日期不得早于今天往前10年。`)}
 if(f.name.includes('邮编')&&entry&&!/^\d{6}$/.test(String(entry)))errors.push(`第${i+1}组：邮编应为6位数字。`);
 if(other(typeof item==='object'&&item?.value!==undefined?item.value:entry)&&!String(item?.other||'').trim())errors.push(`第${i+1}组：请填写“其他”的说明。`);
 }
 let enter=row['入境日期'],leave=row['离境日期'];if(enter&&leave){let a=typeof enter==='object'?enter.value:enter,b=typeof leave==='object'?leave.value:leave;if(a&&b){let as=a.length===7?a+'-01':a,be=b.length===7?b+'-31':b;if(be<as)errors.push(`第${i+1}组：离境日期不能早于入境日期。`)}}
 }
 if(q.n===18){let since=monthNum(val(BY_NUM[16])),prior=currentMonth();if(Number.isFinite(since)){let cursor=since;for(let i=0;i<rows.length;i++){let r=rows[i],start=monthNum(r['开始年月']),end=monthNum(r['结束年月']);if(Number.isFinite(start)&&Number.isFinite(end)){if(start>end)errors.push(`第${i+1}组：开始年月不能晚于结束年月。`);if(!(end===cursor||end===cursor-1))errors.push(`第${i+1}组：结束年月与相邻住址未首尾衔接，请核对或继续添加。`);cursor=start}}let earliest=monthNum(rows[rows.length-1]?.['开始年月']);if(!Number.isFinite(earliest)||earliest>prior-24)errors.push('住址历史未覆盖满24个月，请继续添加以往住址。')}}
 }

function travelCountHint(){let v=val(BY_NUM[40]);if(!v||v==='没有去过')return '';let n=Array.isArray(val(BY_NUM[41]))?val(BY_NUM[41]).length:0;let valid=v==='1次'?n===1:v==='2次'?n===2:v==='3–5次'?n>=3&&n<=5:v==='5次以上'?n>=6:true;return valid?'':`提示：第40题选择“${v}”，目前第41题填写${n}组出行记录，数量不一致；请核对。此提示不会阻止提交。`}

function validatePage(){let first=null;for(let q of PAGES[state.page].entries){if(q.n==null||!visible(q))continue;let el=$('#q'+q.n),errors=validate(q);if(!el)continue;el.classList.toggle('invalid',errors.length>0);el.querySelector('.error').textContent=errors.join('\n');if(errors.length&&!first)first=el}updateWarnings();if(first){first.scrollIntoView({behavior:'smooth',block:'start'});return false}return true}
function output(){let res={},reasons=[];for(let q of QUESTIONS){if(!visible(q)||['说明文字','提示'].includes(q.type)||!q.field)continue;let v=val(q);if(isEmpty(v))continue;
 let keys=q.field.split(/\s*\/\s*/).map(x=>x.trim()).filter(Boolean);
 if(q.type==='姓名组'&&keys.length===2){res[keys[0]]=v.family||'';res[keys[1]]=v.given||''}
 else if(q.type==='重复组')res[keys[0]]=Array.isArray(v)?v.map(row=>{let out={};for(let f of subfields(q)){let item=row[f.name];if(item!==undefined&&!isEmpty(item))out[f.name]=item}return out}):[];
 else if(keys.length===1){let item=v;if((q.type==='单选'||q.type==='多选')&&(Array.isArray(v)?v.some(other):other(v))&&otherData(q))item={value:v,other:otherData(q)};res[keys[0]]=item}
 if(q.system.includes('转人工')){let trigger=(q.n===10&&v==='有')||([21,27].includes(q.n)&&v==='无法提供')||(q.n===33&&v==='是')||(q.n===47&&Array.isArray(v)&&v.length);if(trigger)reasons.push(`第${q.n}题：${q.title}`)}

function reviewValue(v){

 if(typeof v!=='object')return esc(v==='父母自有'?'学生的父母自有':v==='父母租赁'?'学生的父母租赁':v).replace(/\n/g,'<br>');

  if(!v.length)return '<span class="review-muted">未填写</span>';

 return '<dl class="review-pairs">'+Object.entries(v).filter(([,item])=>!isEmpty(item)).map(([key,item])=>'<div><dt>'+esc(labels[key]||key)+'</dt><dd>'+reviewValue(item)+'</dd></div>').join('')+'</dl>';

 let v=val(q);if(['日期','年月'].includes(q.type))return esc(String(v||'').replace(/-/g,' / '));if((q.type==='单选'||q.type==='多选')&&(Array.isArray(v)?v.some(other):other(v))&&otherData(q))return reviewValue(v)+'：'+esc(otherData(q));return reviewValue(v);

function reviewIntro(){
