function render(){let page=PAGES[state.page];$('#pageNo').textContent=`第${state.page+1}/11页`;$('#prog').style.width=((state.page+1)/11*100)+'%';if(state.finished){renderSummary();return}let html=`<div class="notice">仅供测试，请勿填写真实个人资料。本原型不上传或发送数据。</div><div class="hero"><h1>${esc(page.title)}</h1><p>请按实际情况填写，带 <span class="star">*</span> 为必填项。</p></div>`;for(let q of page.entries){if(!visible(q))continue;if(q.type==='说明文字'){html+=`<div class="notice intro">${esc(q.title)}</div>`;continue}html+=`<section class="question" data-q="${q.n}" id="q${q.n}"><div class="qtitle"><span class="num">第${q.n}题</span>${esc(q.title)}${q.required?'<span class="star">*</span>':''}</div>${control(q,val(q))}${q.hint?`<div class="hint">${esc(q.hint)}</div>`:''}<div class="error" aria-live="polite"></div><div class="warning"></div></section>`}html+=`<div class="bar"><button class="secondary" id="back" ${state.page===0?'disabled':''}>上一步</button><button class="primary" id="next">${state.page===10?'提交':'下一步'}</button></div><button class="muted-action" id="clear">清空重填</button><div class="footer-note">填写内容仅保存在当前浏览器。本原型不上传文件、不发送任何数据；刷新后文件需重新选择。</div>`;app.innerHTML=html;bind();updateWarnings()}

function bind(){app.querySelectorAll('[data-q]').forEach(el=>{

 });$('#back').onclick=()=>{if(state.page>0){state.page--;store();render();window.scrollTo(0,0)}};$('#next').onclick=()=>{if(!validatePage())return;if(state.page<10){state.page++;store();render();window.scrollTo(0,0)}else{state.finished=true;store();render();window.scrollTo(0,0)}};$('#clear').onclick=clearAll}
function onInput(q,e,changed){let t=e.target;if(!t.matches('input,select,textarea'))return;

 if(t.dataset.dateprecision!==undefined){if(!changed)return;let box=t.closest('[data-datebox]'),current=box.querySelector('[data-datevalue]'),isMonth=t.checked;let obj={value:current.value?(isMonth?current.value.slice(0,7):(current.value.length===10?current.value:'')):'',precision:isMonth?'month':'day'};if(q.type==='重复组'){let rows=getRows(q),idx=Number(t.closest('.rep').dataset.index),field=subfields(q)[Number(t.closest('[data-field-index]').dataset.fieldIndex)].name;rows[idx][field]=obj;commit(q,rows,true)}return}
 if(t.type==='file'){if(!changed)return;let files=Array.from(t.files||[]).map(f=>({name:f.name,size:f.size,type:f.type}));if(q.type==='重复组'){let rows=getRows(q),idx=Number(t.closest('.rep').dataset.index),f=subfields(q)[Number(t.dataset.sub)];rows[idx][f.name]=files[0]||null;commit(q,rows)}else commit(q,files);let names=t.nextElementSibling;if(names)names.textContent=files.map(f=>f.name).join('、')||'未选择文件';return}

 if(q.type==='单选'||q.type==='多选'){if(!changed)return;let v=q.type==='多选'?Array.from(e.currentTarget.querySelectorAll('input[data-main]:checked')).map(x=>x.value):e.currentTarget.querySelector('input[data-main]:checked')?.value||'';commit(q,v,true);return}

function isTravel(q){return [39,41,43].includes(q.n)}
function dateBounds(v,isTravelDate){let txt=typeof v==='object'?v?.value:v;if(!txt)return [];let month=typeof v==='object'&&v?.precision==='month'||/^\d{4}-\d{2}$/.test(String(txt));let low=month?txt+'-01':txt, high=month?txt+'-31':txt;let e=[];if(low>dayNow())e.push('日期不得晚于今天。');if(isTravelDate&&high<tenYearsAgo())e.push('出行日期不得早于今天往前10年。');return e}
function validate(q){let v=val(q),errors=[];if(['提示','说明文字'].includes(q.type))return errors;

 if(q.n===33&&v==='是'){let d=parentTravelDetails(),parents=Array.isArray(d.parents)?d.parents:[];if(!parents.length)errors.push('请至少选择一位随团同行的家长。');for(let p of parents){if(!String(d[p==='父亲'?'father_passport':'mother_passport']||'').trim())errors.push('请填写学生的'+p+'护照号码。')}}

 if((q.type==='单选'||q.type==='多选')&&(Array.isArray(v)?v.some(other):other(v||''))&&!otherData(q).trim())errors.push('请填写“其他”的具体内容。');
 if(q.type==='年月'&&v&&(!Number.isFinite(monthNum(v))||monthNum(v)>currentMonth()))errors.push('年月不正确或晚于当前年月。');

 if(q.type==='重复组'){let rows=Array.isArray(v)&&v.length?v:[{}],fields=subfields(q);for(let i=0;i<rows.length;i++){let row=rows[i];for(let f of fields){let item=row[f.name],entry=typeof item==='object'&&item?.value!==undefined?item.value:item;

 }
 let enter=row['入境日期'],leave=row['离境日期'];if(enter&&leave){let a=typeof enter==='object'?enter.value:enter,b=typeof leave==='object'?leave.value:leave;if(a&&b){let as=a.length===7?a+'-01':a,be=b.length===7?b+'-31':b;if(be<as)errors.push(`第${i+1}组：离境日期不能早于入境日期。`)}}
 }
 if(q.n===18){let since=monthNum(val(BY_NUM[16])),prior=currentMonth();if(Number.isFinite(since)){let cursor=since;for(let i=0;i<rows.length;i++){let r=rows[i],start=monthNum(r['开始年月']),end=monthNum(r['结束年月']);if(Number.isFinite(start)&&Number.isFinite(end)){if(start>end)errors.push(`第${i+1}组：开始年月不能晚于结束年月。`);if(!(end===cursor||end===cursor-1))errors.push(`第${i+1}组：结束年月与相邻住址未首尾衔接，请核对或继续添加。`);cursor=start}}let earliest=monthNum(rows[rows.length-1]?.['开始年月']);if(!Number.isFinite(earliest)||earliest>prior-24)errors.push('住址历史未覆盖满24个月，请继续添加以往住址。')}}

function travelCountHint(){let v=val(BY_NUM[40]);if(!v||v==='没有去过')return '';let n=Array.isArray(val(BY_NUM[41]))?val(BY_NUM[41]).length:0;let valid=v==='1次'?n===1:v==='2次'?n===2:v==='3–5次'?n>=3&&n<=5:v==='5次以上'?n>=6:true;return valid?'':`提示：第40题选择“${v}”，目前第41题填写${n}组出行记录，数量不一致；请核对。此提示不会阻止提交。`}
